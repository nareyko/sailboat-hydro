[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sailboat-hydro"
version = "1.0.1"
description = "FairHelm sailboat hydrodynamic formulas (hull speed, CSF, D/L, comfort ratio) plus a bundled 93-model Nordic/European benchmark. Zero-Network: no HTTP to api.fairhelm.com."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Vadim Nareyko / FairHelm", email = "info@fairhelm.com" },
]
keywords = [
  "sailboat",
  "yacht",
  "hydrodynamics",
  "hull-speed",
  "capsize-screening",
  "displacement-length",
  "fairhelm",
  "nordic",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://fairhelm.com/en/yachts/formulas/"
Documentation = "https://nareyko.github.io/sailboat-hydro/"
Repository = "https://github.com/nareyko/sailboat-hydro"
Publisher = "https://arviser.com/"
"Open data" = "https://fairhelm.com/open-data/yacht-specs/v1/openapi.yaml"
DOI = "https://doi.org/10.5281/zenodo.23374417"
Issues = "https://github.com/nareyko/sailboat-hydro/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "build>=1.2",
  "twine>=6.0",
]
docs = [
  "mkdocs>=1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sailboat_hydro"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sailboat_hydro",
  "tests",
  "scripts",
  "README.md",
  "LICENSE",
  "CITATION.cff",
  "PUBLISH.md",
  "PUBLISH-DOCS.md",
  "mkdocs.yml",
  ".readthedocs.yaml",
  "docs",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["sailboat_hydro"]
mypy_path = "src"
